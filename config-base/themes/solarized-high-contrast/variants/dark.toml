mode = "dark"

# Solarized dark high contrast (solarized-emacs
# solarized-dark-high-contrast-palette-alist, as drawn dark). Changes:
#   - bg_2: bg_1 moved 0.165 toward fg_0 in OKLab; upstream has none.
#   - dim_1: dim_0 and fg_0 mixed 50/50 in OKLab; upstream has none.
[colors]
bg_0  = "#002732" # base03
bg_1  = "#033744" # base02
bg_2  = "#1c434c" # derived
dim_0 = "#62787f" # base01
dim_1 = "#778b90" # derived
fg_0  = "#8d9fa1"
fg_1  = "#9eacac"

yellow  = "#c49619"
orange  = "#db5823"
red     = "#ec423a"
magenta = "#e2468f"
violet  = "#7a7ed2"
blue    = "#3c98e0"
cyan    = "#3cafa5"
green   = "#93a61a"

[apps]
emacs        = "my-solarized-dark-high-contrast"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
