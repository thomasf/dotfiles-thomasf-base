mode = "dark"

# Selenized black, from the upstream values (jan-warchol/selenized, the-values.md).
# bg_1 is adjusted from upstream #252525 (contrast ratio 1.18:1 on bg_0) to
# #2a2a2a to achieve 1.24:1 contrast ratio for terminal surface visibility.
# dim_1 is not in upstream; mixed 50/50 in OKLab between dim_0 and fg_0.
[colors]
bg_0  = "#181818" # bg_0
bg_1  = "#2a2a2a" # upstream bg_1 is #252525 (raised for >= 1.22:1 contrast)
bg_2  = "#3b3b3b" # bg_2
dim_0 = "#777777" # dim_0
dim_1 = "#979797" # generated: dim_0 and fg_0 mixed 50/50 in OKLab
fg_0  = "#b9b9b9"
fg_1  = "#dedede"

yellow  = "#dbb32d"
orange  = "#e67f43"
red     = "#ed4a46"
magenta = "#eb6eb7"
violet  = "#a580e2"
blue    = "#368aeb"
cyan    = "#3fc5b7"
green   = "#70b433"

br_red     = "#ff5e56"
br_green   = "#83c746"
br_yellow  = "#efc541"
br_blue    = "#4f9cfe"
br_magenta = "#ff81ca"
br_cyan    = "#56d8c9"
br_orange  = "#fa9153"
br_violet  = "#b891f5"

[apps]
emacs        = "my-solarized-selenized-black"
color_scheme = "prefer-dark"

# The root window background, a file in the theme directory, and how
# hsetroot draws it: tile, center, full, fill, cover or extend.
background      = "assets/background-black.png"
background_mode = "tile"
