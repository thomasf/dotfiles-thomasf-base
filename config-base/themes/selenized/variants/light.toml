mode = "light"

# Selenized light (jan-warchol/selenized, the-values.md). Changes:
#   - dim_1: dim_0 and fg_0 mixed 50/50 in OKLab; upstream has none.
[colors]
bg_0  = "#fbf3db"
bg_1  = "#ece3cc"
bg_2  = "#d5cdb6"
dim_0 = "#909995"
dim_1 = "#718081" # derived
fg_0  = "#53676d"
fg_1  = "#3a4d53"

yellow  = "#ad8900"
orange  = "#c25d1e"
red     = "#d2212d"
magenta = "#ca4898"
violet  = "#8762c6"
blue    = "#0072d4"
cyan    = "#009c8f"
green   = "#489100"

br_red     = "#cc1729"
br_green   = "#428b00"
br_yellow  = "#a78300"
br_blue    = "#006dce"
br_magenta = "#c44392"
br_cyan    = "#00978a"
br_orange  = "#bc5819"
br_violet  = "#825dc0"

[apps]
emacs        = "my-solarized-selenized-light"
color_scheme = "prefer-light"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
