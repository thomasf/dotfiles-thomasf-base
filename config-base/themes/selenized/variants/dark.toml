mode = "dark"

[colors]
bg_0  = "#103c48"
bg_1  = "#184956"
bg_2  = "#2d5b69"
dim_0 = "#72898f"
dim_1 = "#8fa2a5" # dim_0 and fg_0 mixed half and half in OKLab, chosen once
fg_0  = "#adbcbc"
fg_1  = "#cad8d9"

yellow  = "#dbb32d"
orange  = "#ed8649"
red     = "#fa5750"
magenta = "#f275be"
violet  = "#af88eb"
blue    = "#4695f7"
cyan    = "#41c7b9"
green   = "#75b938"

br_red     = "#ff665c"
br_green   = "#84c747"
br_yellow  = "#ebc13d"
br_blue    = "#58a3ff"
br_magenta = "#ff84cd"
br_cyan    = "#53d6c7"
br_orange  = "#fd9456"
br_violet  = "#bd96fa"

[apps]
emacs        = "my-solarized-selenized-dark"
color_scheme = "prefer-dark"

# The root window background, a file in the theme directory, and how
# hsetroot draws it: tile, center, full, fill, cover or extend.
background      = "assets/background-dark.png"
background_mode = "tile"
