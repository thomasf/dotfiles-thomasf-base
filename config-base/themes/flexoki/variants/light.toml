mode = "light"

# Flexoki light (kepano/flexoki, stephango.com/flexoki): bg, bg-2, ui-2 (hovered
# borders), tx-3 (comments) and tx (also fg_1); the 600 accents; purple is violet.
[colors]
bg_0  = "#fffcf0"
bg_1  = "#f2f0e5"
bg_2  = "#dad8ce"
dim_0 = "#b7b5ac"
dim_1 = "#6f6e69" # tx-2, muted text
fg_0  = "#100f0f"
fg_1  = "#100f0f"

yellow  = "#ad8301"
orange  = "#bc5215"
red     = "#af3029"
magenta = "#a02f6f"
violet  = "#5e409d"
blue    = "#205ea6"
cyan    = "#24837b"
green   = "#66800b"

# Flexoki 400 tier accents
br_yellow  = "#d0a215"
br_orange  = "#da702c"
br_red     = "#d14d41"
br_magenta = "#ce5d97"
br_violet  = "#8b7ec8"
br_blue    = "#4385be"
br_cyan    = "#3aa99f"
br_green   = "#879a39"

[apps]
emacs        = "my-solarized-flexoki-light"
color_scheme = "prefer-light"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":stripes()"
background_mode = "tile"
