mode = "dark"

# Flexoki dark (kepano/flexoki, stephango.com/flexoki), with purple as violet.
# Changes:
#   - bg_1: ui-2 instead of ui-1 (1.11:1 on bg_0), for 1.24:1.
#   - fg_1: paper instead of tx, which is fg_0, for higher contrast (13.7:1 vs
#     10.6:1).
[colors]
bg_0  = "#100f0f" # black
bg_1  = "#282726" # ui-2
bg_2  = "#343331" # ui-3
dim_0 = "#575653" # tx-3
dim_1 = "#878580" # tx-2
fg_0  = "#cecdc3" # tx
fg_1  = "#e6e4d9" # paper

yellow  = "#d0a215"
orange  = "#da702c"
red     = "#d14d41"
magenta = "#ce5d97"
violet  = "#8b7ec8"
blue    = "#4385be"
cyan    = "#3aa99f"
green   = "#879a39"

# Flexoki 300 tier accents
br_yellow  = "#e3b341"
br_orange  = "#ea8547"
br_red     = "#e8705f"
br_magenta = "#e076ab"
br_violet  = "#9f93db"
br_blue    = "#599ed7"
br_cyan    = "#4ec0b5"
br_green   = "#a0b943"

[apps]
emacs        = "my-solarized-flexoki-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
