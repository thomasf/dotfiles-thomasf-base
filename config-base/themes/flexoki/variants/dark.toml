mode = "dark"

# Flexoki dark (kepano/flexoki, stephango.com/flexoki): bg, bg-2, ui-2 (hovered
# borders), tx-3 (comments) and tx (also fg_1); the 400 accents; purple is violet.
[colors]
bg_0  = "#100f0f"
bg_1  = "#1c1b1a"
bg_2  = "#343331"
dim_0 = "#575653"
dim_1 = "#878580" # tx-2, muted text
fg_0  = "#cecdc3"
fg_1  = "#cecdc3"

yellow  = "#d0a215"
orange  = "#da702c"
red     = "#d14d41"
magenta = "#ce5d97"
violet  = "#8b7ec8"
blue    = "#4385be"
cyan    = "#3aa99f"
green   = "#879a39"

[apps]
emacs        = "my-solarized-flexoki-dark"
color_scheme = "prefer-dark"
