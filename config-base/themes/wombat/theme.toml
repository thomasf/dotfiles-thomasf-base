creator = "Lars H. Nielsen, Kristoffer Grönlund"
url = "emacs/etc/themes/wombat-theme.el"
license = "GPL-3.0-or-later"
description = """
Wombat is a medium-contrast dark gray theme for GNU Emacs
by Kristoffer Grönlund, adapted with permission from the Vim color scheme by Lars H. Nielsen."""

[ansi]
color0 = "bg_1"
color1 = "red"
color2 = "green"
color3 = "yellow"
color4 = "blue"
color5 = "magenta"
color6 = "cyan"
color7 = "dim_0"

color8  = "bg_2"
color9  = "br_red"
color10 = "br_green"
color11 = "orange"
color12 = "br_blue"
color13 = "br_magenta"
color14 = "br_cyan"
color15 = "fg_1"
