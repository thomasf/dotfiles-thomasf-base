mode = "dark"

# From GNU Emacs built-in theme (/home/t/.opt/emacs/etc/themes/wombat-theme.el)
# by Kristoffer Grönlund, adapted from the Vim color scheme by Lars H. Nielsen.
# bg_1 is adjusted from upstream fringe/header #303030 (contrast ratio 1.17:1 on bg_0)
# to #353535 to achieve 1.25:1 contrast ratio for terminal surface visibility.
[colors]
bg_0  = "#242424" # default background
bg_1  = "#353535" # adjusted from upstream #303030 (raised for >= 1.22:1 contrast)
bg_2  = "#444444" # upstream region, mode-line, ansi-color-bright-black
dim_0 = "#99968b" # font-lock-comment-face
dim_1 = "#857b6f" # isearch, mode-line-inactive
fg_0  = "#f6f3e8" # default foreground
fg_1  = "#ffffff" # highlight, ansi-color-bright-white

yellow  = "#ccaa8f" # ansi-color-yellow, font-lock-warning-face
orange  = "#ddaa6f" # escape-glyph, homoglyph
red     = "#b85149" # ansi-color-red
magenta = "#64619a" # ansi-color-magenta
violet  = "#a6a1de" # ansi-color-bright-magenta
blue    = "#5b98c2" # ansi-color-blue
cyan    = "#3f9f9e" # ansi-color-cyan
green   = "#92a65e" # ansi-color-green, font-lock-type-face

# Wombat official Emacs bright ANSI accents
br_yellow  = "#edc4a3" # ansi-color-bright-yellow
br_orange  = "#ddaa6f" # escape-glyph
br_red     = "#e5786d" # ansi-color-bright-red, font-lock-builtin-face
br_magenta = "#a6a1de" # ansi-color-bright-magenta
br_violet  = "#a6a1de" # ansi-color-bright-magenta
br_blue    = "#8ac6f2" # ansi-color-bright-blue, font-lock-keyword-face
br_cyan    = "#70cecc" # ansi-color-bright-cyan
br_green   = "#95e454" # ansi-color-bright-green, font-lock-string-face

[apps]
emacs        = "my-solarized-wombat-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
