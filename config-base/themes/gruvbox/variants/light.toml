mode = "light"

# Upstream gruvbox (morhetz/gruvbox, colors/gruvbox.vim), medium contrast:
# bg0, bg1 and bg2, gray (comments) as dim_0, fg1 (Normal) as fg_0 and fg0 as
# fg_1; faded_* accents, as gruvbox does on a light background.
# Gruvbox has one purple: magenta is it and violet is that purple turned
# toward blue (OKLCH hue 300). The neutral_* colors are the terminal's
# normal colors (see theme.toml).
[colors]
bg_0  = "#fbf1c7"
bg_1  = "#ebdbb2"
bg_2  = "#d5c4a1"
dim_0 = "#928374"
dim_1 = "#7c6f64" # fg4
fg_0  = "#3c3836"
fg_1  = "#282828"

yellow  = "#b57614"
orange  = "#af3a03"
red     = "#9d0006"
magenta = "#8f3f71"
violet  = "#6b4e9a"
blue    = "#076678"
cyan    = "#427b58"
green   = "#79740e"

neutral_red    = "#cc241d"
neutral_green  = "#98971a"
neutral_yellow = "#d79921"
neutral_blue   = "#458588"
neutral_purple = "#b16286"
neutral_aqua   = "#689d6a"

[apps]
# solarized-emacs's gruvbox is dimmer than this one (its text is fg4).
emacs        = "my-solarized-gruvbox-light"
color_scheme = "prefer-light"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":stripes()"
background_mode = "tile"
