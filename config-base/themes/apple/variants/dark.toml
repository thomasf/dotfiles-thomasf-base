mode = "dark"

# Apple dark: default colors, increased contrast colors as brights. Changes:
#   - bg_1: gray 4 instead of gray 5 (1.22:1 on bg_0), for 1.50:1.
[colors]
bg_0  = "#1c1c1e" # gray 6
bg_1  = "#3a3a3c" # gray 4
bg_2  = "#48484a" # gray 3
dim_0 = "#8e8e93" # gray
fg_0  = "#ebebf5" # label secondary
fg_1  = "#ffffff" # label primary

yellow  = "#ffd600"
orange  = "#ff9230"
red     = "#ff4245"
magenta = "#db34f2" # purple
violet  = "#6d7cff" # indigo
blue    = "#0091ff"
cyan    = "#00dac3" # mint
green   = "#30d158"

br_red     = "#ff6165"
br_green   = "#4ad968"
br_yellow  = "#fedf43"
br_blue    = "#5cb8ff"
br_magenta = "#ea8dff" # purple
br_cyan    = "#54dfcb" # mint

[apps]
emacs        = "my-solarized-apple-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
