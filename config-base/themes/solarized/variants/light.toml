mode = "light"

# Solarized light (solarized-emacs solarized-light-color-palette-alist, as
# drawn light). Changes:
#   - bg_2: bg_1 moved 0.165 toward fg_0 in OKLab; upstream has none.
[colors]
bg_0  = "#fdf6e3" # base3
bg_1  = "#eee8d5" # base2
bg_2  = "#d6d5c7" # derived
dim_0 = "#93a1a1"
dim_1 = "#839496" # base0, as drawn light
fg_0  = "#657b83"
fg_1  = "#586e75"

yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"

[apps]
emacs        = "my-solarized-light"
color_scheme = "prefer-light"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
