mode = "dark"

# From solarized-dark-color-palette-alist, drawn as dark by solarized-emacs.
# bg_1 is adjusted from upstream base02 (#073642, contrast ratio 1.15:1 on bg_0)
# to #093b48 to achieve 1.24:1 contrast ratio for terminal surface visibility.
# bg_2 is not in upstream Solarized; added as a third surface level with a
# monotonic 1.22:1 contrast step from bg_1.
[colors]
bg_0  = "#002b36" # base03
bg_1  = "#093b48" # upstream base02 is #073642 (raised for >= 1.22:1 contrast)
bg_2  = "#224954" # generated surface level (upstream has no bg_2)
dim_0 = "#586e75"
dim_1 = "#657b83" # base00
fg_0  = "#839496"
fg_1  = "#93a1a1"

yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"

[apps]
emacs        = "my-solarized-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":stripes()"
background_mode = "tile"
