mode = "dark"

# Solarized dark (solarized-emacs solarized-dark-color-palette-alist, as drawn
# dark). Changes:
#   - bg_1: base02 (#073642, 1.15:1 on bg_0) raised to #093b48, for 1.24:1.
#   - bg_2: a third surface, a 1.22:1 step from bg_1; upstream has none.
[colors]
bg_0  = "#002b36" # base03
bg_1  = "#093b48" # adjusted base02
bg_2  = "#224954" # derived
dim_0 = "#586e75"
dim_1 = "#657b83" # base00
fg_0  = "#839496"
fg_1  = "#93a1a1"

yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"

[apps]
emacs        = "my-solarized-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
