mode = "dark"

# Monochrome White on Black: Classic P4 phosphor CRT paper-white on dark background.
[colors]
bg_0  = "#101214"
bg_1  = "#262a2e"
bg_2  = "#3c4248"
dim_0 = "#727a82"
dim_1 = "#949ca4"
fg_0  = "#ccd2d8"
fg_1  = "#f4f6f8"

yellow  = "#f0f2f5"
orange  = "#e0e3e6"
red     = "#f7f9fa"
magenta = "#c8ccd0"
violet  = "#a8aeb4"
blue    = "#d0d4d8"
cyan    = "#d8dce0"
green   = "#b8bec4"

br_red     = "#ffffff"
br_green   = "#c4c8cd"
br_yellow  = "#f6f8fa"
br_blue    = "#dce0e4"
br_magenta = "#d0d4d8"
br_cyan    = "#e4e8ec"

urgent = "#58a6ff"

[apps]
emacs        = "my-solarized-mono-dark"
color_scheme = "prefer-dark"

background      = ":random()"
background_mode = "tile"
