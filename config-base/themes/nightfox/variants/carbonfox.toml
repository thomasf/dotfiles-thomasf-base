mode = "dark"

# Carbonfox (EdenEast/nightfox.nvim, based on oxocarbon and IBM Carbon); bg1,
# fg0 and fg1 are the values upstream computes. Changes:
#   - bg_1: bg3 instead of bg2 (1.18:1 on bg_0), for 1.48:1.
#   - yellow, orange, red: IBM Carbon's yellow 30, orange 40 and red 50;
#     upstream's are two teals and a magenta. Brights are shade 0.15, as
#     upstream computes them.
#   - cyan: its teal (upstream's yellow), as its cyan is close to its blue.
[colors]
bg_0  = "#161616" # bg1
bg_1  = "#353535" # bg3
bg_2  = "#535353" # bg4
dim_0 = "#6e6f70" # comment
dim_1 = "#b6b8bb" # fg2
fg_0  = "#f2f4f8" # fg1
fg_1  = "#f9fbff" # fg0

yellow  = "#f1c21b" # Carbon yellow 30
orange  = "#ff832b" # Carbon orange 40
red     = "#fa4d56" # Carbon red 50
magenta = "#ff7eb6"
violet  = "#be95ff"
blue    = "#78a9ff"
cyan    = "#08bdba" # upstream yellow (Carbon teal 40)
green   = "#25be6a"

br_red     = "#fb686f" # Carbon red 50, shade 0.15
br_green   = "#46c880"
br_yellow  = "#f3cb3d" # Carbon yellow 30, shade 0.15
br_blue    = "#8cb6ff"
br_magenta = "#ff91c1" # pink.bright (shade 0.15)
br_cyan    = "#2dc7c4" # upstream bright yellow

[apps]
emacs        = "my-solarized-carbonfox"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
