mode = "dark"

# Nightfox (EdenEast/nightfox.nvim). Changes:
#   - bg_1: bg3 instead of bg2 (1.15:1 on bg_0), for 1.35:1.
[colors]
bg_0  = "#192330" # bg1
bg_1  = "#29394f" # bg3
bg_2  = "#39506d" # bg4
dim_0 = "#738091" # comment
dim_1 = "#aeafb0" # fg2
fg_0  = "#cdcecf" # fg1
fg_1  = "#d6d6d7" # fg0

yellow  = "#dbc074"
orange  = "#f4a261"
red     = "#c94f6d"
magenta = "#d67ad2"
violet  = "#9d79d6"
blue    = "#719cd6"
cyan    = "#63cdcf"
green   = "#81b29a"

br_red     = "#d16983"
br_green   = "#8ebaa4"
br_yellow  = "#e0c989"
br_blue    = "#86abdc"
br_magenta = "#dc8ed9" # pink.bright (shade 0.15)
br_cyan    = "#7ad5d6"

[apps]
emacs        = "my-solarized-nightfox"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
