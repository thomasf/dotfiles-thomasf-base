creator = "Thomas Frössman"
url = "https://t.jossystem.se"
license = "GPL-3.0-or-later"
description = """
Home computer palettes on black: the IBM CGA high-intensity text colors. A
few colors are lifted where the original is unreadable on black."""
lint_ignore = ["accent-collision"]

[ansi]
color0 = "bg_1"
color1 = "red"
color2 = "green"
color3 = "yellow"
color4 = "blue"
color5 = "magenta"
color6 = "cyan"
color7 = "fg_0"

color8  = "bg_2"
color9  = "br_red"
color10 = "br_green"
color11 = "br_yellow"
color12 = "br_blue"
color13 = "br_magenta"
color14 = "br_cyan"
color15 = "fg_1"
