mode = "dark"

# Kanagawa dragon (rebelot/kanagawa.nvim): ui bg, the comment color, ui fg and
# terminal white; the accents are its terminal colors, with dragonPink as
# magenta and dragonViolet as violet. Changes:
#   - bg_1: dragonBlack3 (#201e1e, 1.09:1 on bg_0) raised to #2b2a2a, for
#     1.26:1.
#   - bg_2: dragonBlack5 instead of dragonBlack4, for a 1.25:1 step.
#   - fg_0: dragonWhite instead of fujiWhite, which is fg_1.
#   - blue, cyan: dragonBlue and waveAqua2, as its terminal blue and cyan
#     (dragonBlue2, dragonAqua) are nearly identical.
#   - orange: dragonOrange (#b6927b) with OKLCH chroma raised from 0.054 to
#     0.09, same hue and lightness, as it read as a tan between red and yellow.
[colors]
bg_0  = "#181616" # dragonBlack2
bg_1  = "#2b2a2a" # adjusted dragonBlack3
bg_2  = "#393836" # dragonBlack5
dim_0 = "#737c73" # dragonGray
dim_1 = "#9e9b93" # dragonGray2
fg_0  = "#c5c9c5" # dragonWhite
fg_1  = "#dcd7ba" # fujiWhite

yellow  = "#c4b28a"
orange  = "#c68b64" # adjusted dragonOrange
red     = "#c4746e"
magenta = "#a292a3"
violet  = "#8992a7"
blue    = "#658594"
cyan    = "#7aa89f"
green   = "#8a9a7b"

br_red     = "#e46876"
br_green   = "#87a987"
br_yellow  = "#e6c384"
br_blue    = "#7fb4ca"
br_magenta = "#938aa9"
br_cyan    = "#68ad99"

[apps]
emacs        = "my-solarized-kanagawa-dragon"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
