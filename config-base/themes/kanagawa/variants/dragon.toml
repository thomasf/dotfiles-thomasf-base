mode = "dark"

# Kanagawa dragon (rebelot/kanagawa.nvim): ui bg, bg_p1, bg_p2, the comment color,
# ui fg and terminal white; the accents are its terminal colors, with dragonPink
# as magenta, dragonOrange as orange and dragonViolet as violet. Its terminal
# blue and cyan (dragonBlue2, dragonAqua) are nearly the same color, so blue is
# dragonBlue and cyan is waveAqua2.
[colors]
bg_0  = "#181616"
bg_1  = "#282727"
bg_2  = "#393836"
dim_0 = "#737c73"
dim_1 = "#9e9b93" # dragonGray2
fg_0  = "#c5c9c5"
fg_1  = "#c5c9c5"

yellow  = "#c4b28a"
orange  = "#b6927b"
red     = "#c4746e"
magenta = "#a292a3"
violet  = "#8992a7"
blue    = "#658594"
cyan    = "#7aa89f"
green   = "#8a9a7b"

br_red     = "#e46876"
br_green   = "#87a987"
br_yellow  = "#e6c384"
br_blue    = "#7fb4ca"
br_magenta = "#938aa9"
br_cyan    = "#68ad99"

[apps]
emacs        = "my-solarized-kanagawa-dragon"
color_scheme = "prefer-dark"
