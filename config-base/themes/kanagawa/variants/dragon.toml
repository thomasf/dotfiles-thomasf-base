mode = "dark"

# Kanagawa dragon (rebelot/kanagawa.nvim): ui bg, the comment color, ui fg and
# terminal white; the accents are its terminal colors, with dragonPink as magenta,
# dragonOrange as orange and dragonViolet as violet.
# bg_1 is adjusted from upstream dragonBlack3 (#201e1e, contrast ratio 1.09:1 on bg_0)
# to #2b2a2a to achieve 1.26:1 contrast ratio for terminal surface visibility.
# bg_2 uses upstream dragonBlack5 (#393836) instead of dragonBlack4 (#282727)
# for a monotonic 1.25:1 contrast step.
# fg_0 uses upstream dragonWhite (#c5c9c5) instead of duplicating fujiWhite (#dcd7ba, fg_1).
# Upstream terminal blue and cyan (dragonBlue2, dragonAqua) are nearly identical,
# so blue is dragonBlue (#658594) and cyan is waveAqua2 (#7aa89f).
[colors]
bg_0  = "#181616" # dragonBlack2
bg_1  = "#2b2a2a" # adjusted from dragonBlack3 #201e1e (raised for >= 1.22:1 contrast)
bg_2  = "#393836" # upstream dragonBlack5 (used over dragonBlack4 for >= 1.22:1 contrast step)
dim_0 = "#737c73" # dragonGray
dim_1 = "#9e9b93" # dragonGray2
fg_0  = "#c5c9c5" # dragonWhite (used over fujiWhite for distinct body vs emphasized text)
fg_1  = "#dcd7ba" # fujiWhite

yellow  = "#c4b28a"
orange  = "#b6927b"
red     = "#c4746e"
magenta = "#a292a3"
violet  = "#8992a7"
blue    = "#658594"
cyan    = "#7aa89f"
green   = "#8a9a7b"

br_red     = "#e46876"
br_green   = "#87a987"
br_yellow  = "#e6c384"
br_blue    = "#7fb4ca"
br_magenta = "#938aa9"
br_cyan    = "#68ad99"

[apps]
emacs        = "my-solarized-kanagawa-dragon"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":stripes()"
background_mode = "tile"
