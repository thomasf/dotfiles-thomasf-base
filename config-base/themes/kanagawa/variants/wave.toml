mode = "dark"

# Kanagawa wave (rebelot/kanagawa.nvim): ui bg, the comment color, ui fg and
# terminal white; the accents are its terminal colors, with sakuraPink as
# magenta, surimiOrange as orange and oniViolet as violet. Changes:
#   - bg_1: sumiInk3 (#22222a, 1.04:1 on bg_0) raised to #2f2f3e, for 1.24:1.
#   - bg_2: sumiInk4 (#2a2a37) raised to #3f3f52, for a 1.27:1 step.
#   - dim_1: dim_0 and fg_0 mixed 50/50 in OKLab; upstream has none.
[colors]
bg_0  = "#1f1f28" # sumiInk1
bg_1  = "#2f2f3e" # adjusted sumiInk3
bg_2  = "#3f3f52" # adjusted sumiInk4
dim_0 = "#727169" # fujiGray
dim_1 = "#a5a391" # derived
fg_0  = "#dcd7ba"
fg_1  = "#dcd7ba"

yellow  = "#c0a36e"
orange  = "#ffa066"
red     = "#c34043"
magenta = "#d27e99"
violet  = "#957fb8"
blue    = "#7e9cd8"
cyan    = "#6a9589"
green   = "#76946a"

br_red     = "#e82424"
br_green   = "#98bb6c"
br_yellow  = "#e6c384"
br_blue    = "#7fb4ca"
br_magenta = "#938aa9"
br_cyan    = "#68ad99"

[apps]
emacs        = "my-solarized-kanagawa-wave"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
