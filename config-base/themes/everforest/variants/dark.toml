mode = "dark"

# Everforest dark (sainnhe/everforest, medium contrast). Changes:
#   - bg_1: bg2 instead of bg1 (1.15:1 on bg_0), for 1.25:1.
#   - bg_2: bg3 instead of bg2, for a 1.25:1 step.
#   - fg_1: statusline1 instead of fg, which is fg_0, for higher contrast
#     (7.3:1 vs 4.9:1).
#   - violet: its one purple, magenta, turned to OKLCH hue 300.
[colors]
bg_0  = "#2d353b" # bg0
bg_1  = "#3d484d" # bg2
bg_2  = "#475258" # bg3
dim_0 = "#859289" # grey0
dim_1 = "#9da9a0" # grey2
fg_0  = "#d3c6aa" # fg
fg_1  = "#fdf6e3" # statusline1

yellow  = "#dbbc7f"
orange  = "#e69875"
red     = "#e67e80"
magenta = "#d699b6"
violet  = "#b6a3db"
blue    = "#7fbbb3"
cyan    = "#83c092"
green   = "#a7c080"

[apps]
emacs        = "my-solarized-everforest-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
