mode = "dark"

# Everforest dark (sainnhe/everforest, medium contrast).
# bg_1 uses upstream bg2 (#3d484d) instead of bg1 (#343f44, contrast ratio 1.15:1 on bg_0)
# to achieve 1.25:1 contrast ratio for terminal surface visibility.
# bg_2 uses upstream bg3 (#475258) instead of bg2 for a monotonic 1.25:1 contrast step.
# fg_1 uses upstream statusline1 (#fdf6e3) instead of duplicating fg (#d3c6aa, fg_0)
# to give emphasized text higher contrast (7.3:1 vs 4.9:1).
# violet is not in upstream; derived by turning purple toward blue (OKLCH hue 300).
[colors]
bg_0  = "#2d353b" # bg0
bg_1  = "#3d484d" # upstream bg2 (used over bg1 #343f44 for >= 1.22:1 contrast)
bg_2  = "#475258" # upstream bg3 (used over bg2 for monotonic >= 1.22:1 contrast step)
dim_0 = "#859289" # grey0
dim_1 = "#9da9a0" # grey2
fg_0  = "#d3c6aa" # fg
fg_1  = "#fdf6e3" # upstream statusline1 (used over fg for distinct emphasized text)

yellow  = "#dbbc7f"
orange  = "#e69875"
red     = "#e67e80"
magenta = "#d699b6"
violet  = "#b6a3db"
blue    = "#7fbbb3"
cyan    = "#83c092"
green   = "#a7c080"

[apps]
emacs        = "my-solarized-everforest-dark"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":stripes()"
background_mode = "tile"
