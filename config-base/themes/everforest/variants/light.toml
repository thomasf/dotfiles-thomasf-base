mode = "light"

# Everforest light (sainnhe/everforest, medium): bg0, bg1, bg2, grey1 (comments) and
# fg (also fg_1); aqua is cyan; it has one purple, magenta and violet.
[colors]
bg_0  = "#fdf6e3"
bg_1  = "#f4f0d9"
bg_2  = "#efebd4"
dim_0 = "#939f91"
fg_0  = "#5c6a72"
fg_1  = "#5c6a72"

yellow  = "#dfa000"
orange  = "#f57d26"
red     = "#f85552"
magenta = "#df69ba"
violet  = "#df69ba"
blue    = "#3a94c5"
cyan    = "#35a77c"
green   = "#8da101"

[apps]
emacs        = "my-solarized-everforest-light"
color_scheme = "prefer-light"
