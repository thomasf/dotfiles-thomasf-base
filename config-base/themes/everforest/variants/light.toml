mode = "light"

# Everforest light (sainnhe/everforest, medium contrast). Changes:
#   - bg_1: bg2 instead of bg1 (1.12:1 on bg_0), for 1.22:1.
#   - bg_2: bg3 instead of bg2, for a 1.23:1 step.
#   - fg_1: statusline1 instead of fg, which is fg_0, for higher contrast.
#   - violet: its one purple, magenta, turned to OKLCH hue 300.
[colors]
bg_0  = "#fdf6e3" # bg0
bg_1  = "#efebd4" # bg2
bg_2  = "#e6e2cc" # bg3
dim_0 = "#939f91" # grey0
dim_1 = "#829181" # grey2
fg_0  = "#5c6a72" # fg
fg_1  = "#343f44" # statusline1

yellow  = "#dfa000"
orange  = "#f57d26"
red     = "#f85552"
magenta = "#df69ba"
violet  = "#9d79d7"
blue    = "#3a94c5"
cyan    = "#35a77c"
green   = "#8da101"

[apps]
emacs        = "my-solarized-everforest-light"
color_scheme = "prefer-light"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
