mode = "dark"

# From solarized-zenburn-color-palette-alist,
# drawn as dark by solarized-emacs. bg_2 is not in it: it is zenburn-bg+2
# of upstream zenburn-emacs, the level after bg_1 (zenburn-bg+1).
[colors]
bg_0  = "#3f3f3f"
bg_1  = "#4f4f4f"
bg_2  = "#5f5f5f"
dim_0 = "#878777"
dim_1 = "#989890" # zenburn-fg-05
fg_0  = "#dcdccc"
fg_1  = "#ffffef"

yellow  = "#f0dfaf"
orange  = "#dfaf8f"
red     = "#cc9393"
magenta = "#dc8cc3"
violet  = "#bbb0cb"
blue    = "#8cd0d3"
cyan    = "#93e0e3"
green   = "#7f9f7f"

# Zenburn official upstream bright accents (jnurmine/Zenburn, emacs zenburn-theme +1 variants)
br_yellow  = "#f0dfaf"
br_orange  = "#dfaf8f"
br_red     = "#dca3a3"
br_magenta = "#ec93d3"
br_violet  = "#bbb0cb"
br_blue    = "#94bff3"
br_cyan    = "#93e0e3"
br_green   = "#7f9f7f"

[apps]
emacs        = "my-solarized-zenburn"
color_scheme = "prefer-dark"

# The root window background: soft diagonal stripes from bg_0 to bg_1, drawn
# at the DPI of the host, in a direction and width that change on every theme
# switch. background_mode is how hsetroot draws it: tile, center, full, fill,
# cover or extend.
background      = ":random()"
background_mode = "tile"
