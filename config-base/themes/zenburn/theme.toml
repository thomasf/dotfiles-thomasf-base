creator = "Jani Nurminen, Bozhidar Batsov"
url = "https://github.com/bbatsov/zenburn-emacs"
license = "GPL-3.0-or-later"
description = """
Zenburn is a low-contrast color scheme originally created for Vim by Jani
Nurminen, with the color palette formalized for Emacs by Bozhidar Batsov.
It has no bright colors: the terminal's bright yellow and magenta
are orange and violet, and the other bright colors are the normal ones."""

[ansi]
color0 = "bg_1"
color1 = "red"
color2 = "green"
color3 = "yellow"
color4 = "blue"
color5 = "magenta"
color6 = "cyan"
color7 = "dim_0"

color8  = "bg_2"
color9  = "br_red"
color10 = "green"
color11 = "orange"
color12 = "blue"
color13 = "violet"
color14 = "cyan"
color15 = "fg_1"
